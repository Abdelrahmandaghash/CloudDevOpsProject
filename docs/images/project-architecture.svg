<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1600" height="900" viewBox="0 0 1600 900"
     style="background:#ffffff;font-family:Segoe UI,Arial,sans-serif">
  <defs>
    <marker id="arrowGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#5A6C86"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#FF9900"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#8C4FFF"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#D86613"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2875E2"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#7AA116"/></marker>
    <style>
      .title{font-size:26px;font-weight:700;fill:#232F3E}
      .subtitle{font-size:14px;fill:#5A6C86}
      .grp{font-size:14px;font-weight:700;fill:#232F3E}
      .lbl{font-size:13px;fill:#232F3E;font-weight:600}
      .small{font-size:11px;fill:#5A6C86}
      .edge{font-size:11px;fill:#5A6C86;font-weight:600}
      .node{stroke-width:2;rx:10;ry:10}
    </style>
  </defs>

  <!-- Title -->
  <text x="40" y="46" class="title">CloudDevOpsProject — End-to-End GitOps CI/CD Pipeline on AWS</text>
  <text x="40" y="70" class="subtitle">Terraform &#8226; Ansible &#8226; Jenkins &#8226; Docker &#8226; Amazon EKS &#8226; ArgoCD</text>
  <line x1="40" y1="84" x2="1560" y2="84" stroke="#E3E8EF" stroke-width="2"/>

  <!-- ============ TOP: CI/CD FLOW ============ -->
  <text x="40" y="112" class="grp">CI / CD FLOW</text>

  <!-- GitHub -->
  <rect x="60" y="130" width="150" height="86" class="node" fill="#F6F8FA" stroke="#24292F"/>
  <text x="135" y="163" text-anchor="middle" font-size="24" font-weight="700" fill="#24292F">GitHub</text>
  <text x="135" y="188" text-anchor="middle" class="small">main branch</text>
  <text x="135" y="204" text-anchor="middle" class="small">source + k8s/</text>

  <!-- Jenkins -->
  <rect x="310" y="130" width="160" height="86" class="node" fill="#FDEDE8" stroke="#D86613"/>
  <text x="390" y="163" text-anchor="middle" font-size="22" font-weight="700" fill="#D24939">Jenkins</text>
  <text x="390" y="188" text-anchor="middle" class="small">EC2 t3.small :8080</text>
  <text x="390" y="204" text-anchor="middle" class="small">shared-lib: 6 stages</text>

  <!-- ECR -->
  <rect x="570" y="130" width="150" height="86" class="node" fill="#FFF3E6" stroke="#FF9900"/>
  <text x="645" y="163" text-anchor="middle" font-size="22" font-weight="700" fill="#B45F06">Amazon ECR</text>
  <text x="645" y="188" text-anchor="middle" class="small">frontend / auth</text>
  <text x="645" y="204" text-anchor="middle" class="small">roadmap</text>

  <!-- ArgoCD -->
  <rect x="820" y="130" width="160" height="86" class="node" fill="#FDEEE8" stroke="#EF7B4D"/>
  <text x="900" y="163" text-anchor="middle" font-size="22" font-weight="700" fill="#E2542A">ArgoCD</text>
  <text x="900" y="188" text-anchor="middle" class="small">ivolve-app</text>
  <text x="900" y="204" text-anchor="middle" class="small">prune + selfHeal</text>

  <!-- EKS -->
  <rect x="1080" y="130" width="160" height="86" class="node" fill="#E9F0FA" stroke="#2875E2"/>
  <text x="1160" y="163" text-anchor="middle" font-size="22" font-weight="700" fill="#1E5AA8">Amazon EKS</text>
  <text x="1160" y="188" text-anchor="middle" class="small">ivolve-cluster</text>
  <text x="1160" y="204" text-anchor="middle" class="small">2 worker nodes</text>

  <!-- Users -->
  <rect x="1340" y="130" width="160" height="86" class="node" fill="#EAF6EC" stroke="#7AA116"/>
  <text x="1420" y="163" text-anchor="middle" font-size="22" font-weight="700" fill="#3F7A15">Users</text>
  <text x="1420" y="188" text-anchor="middle" class="small">browser</text>
  <text x="1420" y="204" text-anchor="middle" class="small">login + roadmap</text>

  <!-- Arrows top row -->
  <line x1="212" y1="160" x2="306" y2="160" stroke="#5A6C86" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="259" y="151" text-anchor="middle" class="edge">push code</text>

  <line x1="472" y1="160" x2="566" y2="160" stroke="#D86613" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="519" y="151" text-anchor="middle" class="edge">build / scan / push</text>

  <line x1="722" y1="160" x2="816" y2="160" stroke="#5A6C86" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="769" y="151" text-anchor="middle" class="edge">manifest commit</text>

  <line x1="982" y1="160" x2="1076" y2="160" stroke="#EF7B4D" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1029" y="151" text-anchor="middle" class="edge">GitOps sync</text>

  <line x1="1242" y1="160" x2="1336" y2="160" stroke="#2875E2" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="1289" y="151" text-anchor="middle" class="edge">ingress</text>

  <!-- Return arrows (below top row) -->
  <path d="M645 218 V250 H135 V218" fill="none" stroke="#D86613" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowRed)"/>
  <text x="380" y="246" text-anchor="middle" class="edge">Jenkins writes k8s/ image tag back to GitHub</text>

  <path d="M1160 218 V278 H645 V218" fill="none" stroke="#FF9900" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowOrange)"/>
  <text x="900" y="272" text-anchor="middle" class="edge">nodes pull images from ECR</text>

  <!-- ============ MIDDLE: AWS CLOUD ============ -->
  <rect x="40" y="300" width="1520" height="410" rx="14" fill="none" stroke="#232F3E" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="60" y="326" class="grp" fill="#232F3E">AWS Cloud — us-east-1</text>

  <!-- VPC -->
  <rect x="70" y="345" width="830" height="340" rx="12" fill="none" stroke="#8C4FFF" stroke-width="2"/>
  <text x="90" y="370" class="grp" fill="#8C4FFF">VPC 10.0.0.0/16 — ivolve-vpc</text>

  <!-- Public subnet -->
  <rect x="95" y="385" width="370" height="275" rx="10" fill="#F2F6E8" stroke="#7AA116" stroke-width="2"/>
  <text x="110" y="408" class="lbl" fill="#248814">Public subnet 10.0.1.0/24</text>
  <rect x="115" y="425" width="330" height="92" rx="8" fill="#FFFFFF" stroke="#D86613" stroke-width="2"/>
  <text x="130" y="452" class="lbl">EC2 — jenkins-server (t3.small)</text>
  <text x="130" y="474" class="small">sg jenkins-sg: 22 / 8080</text>
  <text x="130" y="494" class="small">profile jenkins-profile → ECR PowerUser</text>
  <rect x="115" y="535" width="330" height="60" rx="8" fill="#FFFFFF" stroke="#FF9900" stroke-width="2"/>
  <text x="130" y="558" class="lbl">NAT Gateway + IGW</text>
  <text x="130" y="578" class="small">outbound for private subnets</text>
  <text x="110" y="630" class="small">public-rt → 0.0.0.0/0 via IGW</text>

  <!-- Private subnet -->
  <rect x="485" y="385" width="395" height="275" rx="10" fill="#F7F4FF" stroke="#8C4FFF" stroke-width="2"/>
  <text x="500" y="408" class="lbl" fill="#6A3AB2">Private subnets 10.0.3.0/24 + 10.0.4.0/24</text>
  <rect x="505" y="425" width="355" height="112" rx="8" fill="#FFFFFF" stroke="#2875E2" stroke-width="2"/>
  <text x="520" y="452" class="lbl">EKS managed node group — ivolve-nodes</text>
  <text x="520" y="474" class="small">2 x t3.small across two AZs</text>
  <text x="520" y="494" class="small">namespace ivolve: frontend / auth / roadmap</text>
  <text x="520" y="514" class="small">StatefulSet mysql + 1 Gi EBS PVC (ebs-sc)</text>
  <text x="520" y="528" class="small">ingress-nginx controller → AWS Load Balancer</text>
  <rect x="505" y="555" width="355" height="70" rx="8" fill="#FFFFFF" stroke="#4ECDC4" stroke-width="2"/>
  <text x="520" y="580" class="lbl">OIDC provider + IRSA — ebs-csi-controller-role</text>
  <text x="520" y="601" class="small">aws-ebs-csi-driver add-on → EBS volumes</text>
  <text x="500" y="645" class="small">private-rt → 0.0.0.0/0 via NAT</text>

  <!-- Right-side AWS services -->
  <rect x="930" y="345" width="230" height="90" rx="10" fill="#FDF6E3" stroke="#FF9900" stroke-width="2"/>
  <text x="1045" y="375" text-anchor="middle" class="lbl">S3 — Terraform state</text>
  <text x="1045" y="397" text-anchor="middle" class="small">ivolve-terraform-state-020139096861</text>
  <text x="1045" y="417" text-anchor="middle" class="small">versioning + encryption</text>

  <rect x="1180" y="345" width="350" height="90" rx="10" fill="#FFF3E6" stroke="#FF9900" stroke-width="2"/>
  <text x="1355" y="375" text-anchor="middle" class="lbl">Amazon ECR — private repositories</text>
  <text x="1355" y="397" text-anchor="middle" class="small">frontend, auth, roadmap</text>
  <text x="1355" y="417" text-anchor="middle" class="small">images tagged with BUILD_NUMBER</text>

  <rect x="930" y="455" width="600" height="100" rx="10" fill="#EEF6FF" stroke="#2875E2" stroke-width="2"/>
  <text x="950" y="482" class="lbl">GitOps inside the cluster</text>
  <text x="950" y="505" class="small">ArgoCD Application ivolve-app watches k8s/ on GitHub main → automated sync (prune + selfHeal)</text>
  <text x="950" y="525" class="small">ConfigMap app-config + Secret app-secret → pods; Ingress frontend-ingress → path / → frontend:3000</text>
  <text x="950" y="543" class="small">Auth → mysql-0.mysql:3306; Frontend → auth:5000 / roadmap:8080</text>

  <!-- Monitors -->
  <rect x="930" y="575" width="600" height="90" rx="10" fill="#EAF6EC" stroke="#7AA116" stroke-width="2"/>
  <text x="950" y="602" class="lbl">Observability &amp; verification</text>
  <text x="950" y="625" class="small">kubectl get nodes / pods / pvc / ingress  &#8226;  terraform output  &#8226;  ansible-inventory --graph</text>
  <text x="950" y="645" class="small">Jenkins Stage View  &#8226;  Trivy HIGH/CRITICAL scan  &#8226;  ArgoCD Synced / Healthy</text>

  <text x="930" y="690" class="small">NACL ivolve-nacl: allow all inbound/outbound on all four subnets (security group is the filtering layer)</text>

  <!-- ============ BOTTOM: PROVISIONING ============ -->
  <text x="40" y="748" class="grp">INFRASTRUCTURE &amp; CONFIGURATION</text>

  <rect x="60" y="765" width="150" height="80" rx="10" fill="#F6F8FA" stroke="#24292F" stroke-width="2"/>
  <text x="135" y="798" text-anchor="middle" font-size="21" font-weight="700" fill="#24292F">Developer</text>
  <text x="135" y="822" text-anchor="middle" class="small">git push</text>

  <rect x="310" y="765" width="160" height="80" rx="10" fill="#F3E8FA" stroke="#7B42BC" stroke-width="2"/>
  <text x="390" y="798" text-anchor="middle" font-size="21" font-weight="700" fill="#7B42BC">Terraform</text>
  <text x="390" y="822" text-anchor="middle" class="small">36 AWS resources</text>

  <rect x="570" y="765" width="160" height="80" rx="10" fill="#FDEDE8" stroke="#EE0000" stroke-width="2"/>
  <text x="650" y="798" text-anchor="middle" font-size="21" font-weight="700" fill="#C00000">Ansible</text>
  <text x="650" y="822" text-anchor="middle" class="small">dynamic inventory</text>

  <rect x="830" y="765" width="160" height="80" rx="10" fill="#FFF3E6" stroke="#FF9900" stroke-width="2"/>
  <text x="910" y="798" text-anchor="middle" font-size="21" font-weight="700" fill="#B45F06">Docker</text>
  <text x="910" y="822" text-anchor="middle" class="small">4-service Compose</text>

  <line x1="212" y1="805" x2="306" y2="805" stroke="#5A6C86" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="259" y="796" text-anchor="middle" class="edge">push code</text>
  <line x1="472" y1="805" x2="566" y2="805" stroke="#FF9900" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="519" y="796" text-anchor="middle" class="edge">Terraform apply</text>
  <line x1="732" y1="805" x2="826" y2="805" stroke="#8C4FFF" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="779" y="796" text-anchor="middle" class="edge">configure Jenkins</text>

  <!-- arrows from provisioning up into AWS -->
  <path d="M390 765 V640 H280 V594" fill="none" stroke="#FF9900" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="330" y="700" text-anchor="middle" class="edge">S3 state + infra</text>
  <path d="M650 765 V550 H280 V520" fill="none" stroke="#8C4FFF" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowPurple)"/>
  <text x="700" y="700" text-anchor="middle" class="edge">Java 21 / Jenkins / Docker / Git / Trivy</text>

  <!-- Legend -->
  <rect x="1040" y="765" width="520" height="96" rx="10" fill="#F8FAFC" stroke="#D5DCE6" stroke-width="1"/>
  <text x="1060" y="789" class="lbl">Legend</text>
  <line x1="1060" y1="806" x2="1100" y2="806" stroke="#FF9900" stroke-width="2" marker-end="url(#arrowOrange)"/><text x="1110" y="810" class="small">Terraform</text>
  <line x1="1190" y1="806" x2="1230" y2="806" stroke="#8C4FFF" stroke-width="2" marker-end="url(#arrowPurple)"/><text x="1240" y="810" class="small">Ansible</text>
  <line x1="1320" y1="806" x2="1360" y2="806" stroke="#D86613" stroke-width="2" marker-end="url(#arrowRed)"/><text x="1370" y="810" class="small">CI pipeline</text>
  <line x1="1060" y1="836" x2="1100" y2="836" stroke="#EF7B4D" stroke-width="2" marker-end="url(#arrowGreen)"/><text x="1110" y="840" class="small">GitOps CD</text>
  <line x1="1190" y1="836" x2="1230" y2="836" stroke="#2875E2" stroke-width="2" marker-end="url(#arrowBlue)"/><text x="1240" y="840" class="small">User traffic</text>
  <line x1="1320" y1="836" x2="1360" y2="836" stroke="#5A6C86" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowGray)"/><text x="1370" y="840" class="small">Git commit</text>
</svg>
