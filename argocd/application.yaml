apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ivolve-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Abdelrahmandaghash/CloudDevOpsProject.git   # change Abdelrahmandaghash
    targetRevision: main
    path: k8s                      # ArgoCD watches this folder
  destination:
    server: https://kubernetes.default.svc
    namespace: ivolve
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
