# NOTE: Jenkins rotates this key every ~3 years. The 2023 key expired
# 2026-03-26 and made apt fail with NO_PUBKEY 7198F4B714ABFC68.
# The repo Release file is now signed by jenkins.io-2026.key.
- name: Download Jenkins key
  get_url:
    url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
    dest: /usr/share/keyrings/jenkins-keyring.asc
    force: true

- name: Add Jenkins repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
    state: present

- name: Install Jenkins
  apt:
    name: jenkins
    state: present
    update_cache: true

- name: Start Jenkins
  service:
    name: jenkins
    state: started
    enabled: true
